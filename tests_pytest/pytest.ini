[pytest]
testpaths = tests_pytest
python_files = test_*.py
python_functions = test_*
timeout = 30
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: 功能1：登录与证书
    account: 功能2/3/9：持仓、资金、改密
    trade: 功能4/5/6/7：买卖、撤单、结果
    market: 功能8：行情查询
    alerts: 功能10：价格提醒
